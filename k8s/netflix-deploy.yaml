apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
      - name: netflix
        image: netflix:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-svc
  namespace: default
spec:
  selector:
    app: netflix
  ports:
  - port: 80
    targetPort: 80
  type: NodePort